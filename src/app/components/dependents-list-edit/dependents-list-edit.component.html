<div class="p-4">
  <p class="text-xl font-semibold">Dependentes:</p>

  <div>
    <button class="rounded-md px-4 py-3 leading-5 text-white bg-sky-600 hover:bg-sky-500">Novo dependente</button>
  </div>
  <div class="my-4 grid grid-cols-2 sm:grid-cols-4 gap-4">
    <mat-form-field class="w-full">
      <mat-label>Nome:</mat-label>
      <input matInput placeholder="Fulano" value="Fulano">
    </mat-form-field>
    <mat-form-field class="w-full">
      <mat-label>Idade:</mat-label>
      <input matInput placeholder="20" value="20">
    </mat-form-field>
    <mat-form-field class="w-full">
      <mat-label>Documento:</mat-label>
      <input matInput placeholder="123.123.123-12" value="123.123.123-12">
    </mat-form-field>
    <div class="flex justify-center items-baseline box-border p-2">
      <button class="rounded-md px-4 py-3 leading-5 text-white bg-red-600 hover:bg-red-500">Excluir</button>
    </div>
  </div>

  <hr class="block sm:hidden">
</div>
