<div class="p-4 flex justify-end gap-2">
  <button class="rounded-md px-4 py-3 leading-5 text-white bg-blue-600 hover:bg-blue-500" (click)="onEditButton()"
    *ngIf="!isInEditMode">Editar</button>
  <button class="rounded-md px-4 py-3 leading-5 text-white bg-red-600 hover:bg-red-500" (click)="onCancelButton()"
    *ngIf="isInEditMode">Cancelar</button>
  <button class="rounded-md px-4 py-3 leading-5 text-white" *ngIf="isInEditMode" [ngClass]="{ 'bg-green-200': !enableSaveButton,
                'bg-green-600 hover:bg-green-500': enableSaveButton,
     }" [disabled]="!enableSaveButton" (click)="onSaveButton()">Salvar</button>
</div>
